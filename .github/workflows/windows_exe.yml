name: "windows_exe"

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@master


    - uses: msys2/setup-msys2@v2
      with:
        install: gcc make curl

    - run: gcc -v
      shell: msys2 {0}

    - name: Setup Lua
      run: |
        curl -O https://www.lua.org/ftp/lua-5.1.5.tar.gz
        tar -xzf lua-5.1.5.tar.gz
      shell: msys2 {0}

    - name: list files
      run: Get-ChildItem